services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MigrationDb: ${ConnectionStrings__MigrationDb:?Set ConnectionStrings__MigrationDb in backend/.env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in backend/.env}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    restart: unless-stopped
